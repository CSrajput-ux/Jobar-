<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #090D16;
      color: #F3F4F6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1F293D;
    }
    .badge {
      background: #4F46E5;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .job-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      color: white;
    }
    .company {
      font-size: 12px;
      color: #818CF8;
      margin-bottom: 12px;
    }
    .clip-btn {
      width: 100%;
      background: #4F46E5;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .clip-btn:hover {
      background: #4338CA;
    }
    .status {
      font-size: 11px;
      color: #10B981;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">JobPilot</span>
    <span style="font-size: 12px; font-weight: 600;">1-Click Job Clipper</span>
  </div>
  <div id="job-info">
    <div id="title" class="job-title">Detecting page...</div>
    <div id="company" class="company">Scanning DOM</div>
    <button id="clip-btn" class="clip-btn">Save to JobPilot Pipeline</button>
    <div id="status" class="status">✓ Clipped & Queued for AI Tailoring!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
