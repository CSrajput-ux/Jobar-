services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobpilot_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - jobpilot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis:
    image: redis:7.2-alpine
    container_name: jobpilot_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - jobpilot_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: jobpilot_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO password required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_prod_data:/data
    networks:
      - jobpilot_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  migration:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jobpilot_prod_migration
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobpilot_db}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobpilot_internal
    restart: "no"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jobpilot_prod_api
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobpilot_db}
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      DB_POOL_SIZE: 50
      DB_MAX_OVERFLOW: 50
      DB_POOL_RECYCLE: 1800
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - jobpilot_internal
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    container_name: jobpilot_prod_worker
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobpilot_db}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - jobpilot_internal

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: jobpilot_prod_web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - jobpilot_internal

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jobpilot_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
    networks:
      - jobpilot_internal
      - jobpilot_public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  jobpilot_internal:
    driver: bridge
  jobpilot_public:
    driver: bridge
